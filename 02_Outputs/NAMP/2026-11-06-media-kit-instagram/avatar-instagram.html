<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0a0a0b;
    --gold: #d4af37;
    --emerald: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  .avatar {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Resplandores sutiles de marca */

  .avatar::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 640px 420px at 82% 12%, rgba(16,185,129,0.12), transparent 70%),
      radial-gradient(ellipse 560px 380px at 90% 55%, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(ellipse 620px 440px at 8% 88%, rgba(16,185,129,0.09), transparent 70%);
  }

  /* Isotipo centrado: ocupa ~62% del lienzo para leer bien
     en el crop circular de Instagram (~110px en el feed). */
  .mark {
    position: relative;
    z-index: 2;
    width: 660px;
    height: 660px;
  }
</style>
</head>
<body>
  <div class="avatar">

    <svg class="mark" viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <radialGradient id="namp-mark-glow">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
          <stop offset="60%" stop-color="#10b981" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="66" fill="url(#namp-mark-glow)" stroke="none" />
      <circle cx="100" cy="100" r="88" stroke="#2a2a2e" stroke-width="3" />
      <circle cx="100" cy="100" r="58" stroke="#2a2a2e" stroke-width="3" />
      <g stroke="#d4af37">
        <path d="M187.7 92.3A88 88 0 0 1 100 188" stroke-width="7" opacity="0.3" />
        <path d="M158.9 165.4A88 88 0 0 1 100 188" stroke-width="8" opacity="0.9" />
        <circle cx="183.7" cy="72.8" r="5" opacity="0.32" fill="#d4af37" stroke="none" />
        <circle cx="173" cy="50.8" r="3.6" opacity="0.18" fill="#d4af37" stroke="none" />
        <circle cx="150.5" cy="27.9" r="2.4" opacity="0.09" fill="#d4af37" stroke="none" />
      </g>
      <circle cx="100" cy="188" r="10" fill="#d4af37" />
      <circle cx="100" cy="188" r="4.2" fill="#ffffff" opacity="0.85" stroke="none" />
      <g stroke="#10b981">
        <path d="M42.2 94.9A58 58 0 0 0 100 158" stroke-width="7" opacity="0.3" />
        <path d="M61.2 143.1A58 58 0 0 0 100 158" stroke-width="8" opacity="0.9" />
        <circle cx="44.8" cy="82.1" r="4.6" opacity="0.32" fill="#10b981" stroke="none" />
        <circle cx="51.9" cy="67.6" r="3.4" opacity="0.18" fill="#10b981" stroke="none" />
        <circle cx="66.7" cy="52.5" r="2.2" opacity="0.09" fill="#10b981" stroke="none" />
      </g>
      <circle cx="100" cy="158" r="10" fill="#10b981" />
      <circle cx="100" cy="158" r="4.2" fill="#ffffff" opacity="0.85" stroke="none" />
      <g transform="rotate(-18 100 100)" opacity="0.55">
        <path d="M14 100a86 34 0 1 0 172 0a86 34 0 1 0 -172 0" stroke="#2a2a2e" stroke-width="1" />
        <circle cx="180" cy="112" r="4.5" fill="#10b981" stroke="none" />
        <circle cx="172" cy="119" r="3.5" fill="#10b981" stroke="none" opacity="0.55" />
        <circle cx="162" cy="124" r="2.7" fill="#10b981" stroke="none" opacity="0.38" />
        <circle cx="150" cy="128" r="1.9" fill="#10b981" stroke="none" opacity="0.24" />
        <circle cx="135" cy="131" r="1.2" fill="#10b981" stroke="none" opacity="0.14" />
      </g>
      <path d="M68 136V64l64 72V64" stroke="#f4f4f5" stroke-width="20" />
    </svg>
  </div>
</body>
</html>
