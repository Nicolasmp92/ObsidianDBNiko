<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!--
  PLANTILLA POST FEED — 1080×1080
  Uso: copiar como `post-XX-slug.html`, editar las zonas marcadas
  con EDITAR y renderizar con ../render.ps1.
-->
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-2: #1d1d20;
    --border: #2a2a2e;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --gold: #d4af37;
    --emerald: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: var(--bg);
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.14;
  }
  .glow--gold {
    width: 640px; height: 640px;
    background: var(--gold);
    top: -260px; right: -200px;
  }
  .glow--emerald {
    width: 560px; height: 560px;
    background: var(--emerald);
    bottom: -240px; left: -200px;
  }

  .rings {
    position: absolute;
    right: -110px;
    top: 130px;
    width: 480px;
    height: 480px;
    opacity: 0.6;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .brand svg { width: 92px; height: 92px; flex-shrink: 0; }
  .brand .word {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .brand .word span {
    color: var(--gold);
    font-weight: 500;
  }
  .brand .tag {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  .spacer { flex: 1; }

  .eyebrow {
    color: var(--emerald);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 92px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -2px;
    color: var(--text);
    max-width: 880px;
    margin-bottom: 36px;
  }
  h1 .accent { color: var(--gold); }

  .sub {
    font-size: 30px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 760px;
    margin-bottom: 52px;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 38px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--gold);
    color: #0a0a0b;
    font-size: 25px;
    font-weight: 700;
    padding: 20px 34px;
    border-radius: 12px;
  }
  .cta--ghost {
    background: transparent;
    border: 2px solid var(--emerald);
    color: var(--emerald);
  }
  .site {
    font-size: 24px;
    font-weight: 600;
    color: var(--muted);
  }
  .site span { color: var(--text); }
</style>
</head>
<body>
  <div class="post">
    <div class="glow glow--gold"></div>
    <div class="glow glow--emerald"></div>

    <svg class="rings" viewBox="0 0 200 200" fill="none" stroke-linecap="round">
      <circle cx="100" cy="100" r="88" stroke="#2a2a2e" stroke-width="1.5" />
      <circle cx="100" cy="100" r="58" stroke="#2a2a2e" stroke-width="1.5" />
      <path d="M100 12a88 88 0 0 1 0 176" stroke="#d4af37" stroke-width="3" />
      <circle cx="100" cy="188" r="5" fill="#d4af37" />
      <path d="M100 42a58 58 0 0 0 0 116" stroke="#10b981" stroke-width="3" />
      <circle cx="100" cy="158" r="5" fill="#10b981" />
    </svg>

    <div class="content">

      <div class="brand">
        <svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="100" cy="100" r="88" stroke="#2a2a2e" stroke-width="3" />
          <circle cx="100" cy="100" r="58" stroke="#2a2a2e" stroke-width="3" />
          <path d="M100 12a88 88 0 0 1 0 176" stroke="#d4af37" stroke-width="6" />
          <circle cx="100" cy="188" r="9" fill="#d4af37" />
          <path d="M100 42a58 58 0 0 0 0 116" stroke="#10b981" stroke-width="6" />
          <circle cx="100" cy="158" r="9" fill="#10b981" />
          <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
                font-family="Inter, 'Segoe UI', system-ui, sans-serif"
                font-size="52" font-weight="700" letter-spacing="2">
            <tspan fill="#d4af37">N</tspan><tspan fill="#f4f4f5">AM</tspan><tspan fill="#10b981">P</tspan>
          </text>
        </svg>
        <div>
          <div class="word">NAMP<span> Ingeniería</span></div>
          <span class="tag">Ingeniería de software a medida</span>
        </div>
      </div>

      <div class="spacer"></div>

      <!-- EDITAR: categoría/tema del post -->
      <p class="eyebrow">Categoría del post</p>

      <!-- EDITAR: titular; envolver la palabra destacada en .accent -->
      <h1>Titular del post con <span class="accent">acento</span>.</h1>

      <!-- EDITAR: bajada de una línea -->
      <p class="sub">Bajada breve que amplía el titular en una o dos líneas.</p>

      <div class="footer">
        <!-- EDITAR: texto del botón; usar .cta--ghost para variante esmeralda -->
        <div class="cta">Texto del CTA</div>
        <div class="site">Visítanos <span>namp.cl</span></div>
      </div>

    </div>
  </div>
</body>
</html>
