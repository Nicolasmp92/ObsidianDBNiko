<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!--
  PLANTILLA HISTORIA — 1080×1920
  Zona segura: mantener texto fuera de los 250px superiores e
  inferiores (ahí Instagram dibuja avatar y caja de respuesta).
-->
<link rel="stylesheet" href="../brand/fonts.css">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --border: #2a2a2e;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --gold: #d4af37;
    --emerald: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    background: var(--bg);
  }

  .story::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 640px 420px at 82% 12%, rgba(16,185,129,0.12), transparent 70%),
      radial-gradient(ellipse 560px 380px at 90% 55%, rgba(212,175,55,0.10), transparent 70%),
      radial-gradient(ellipse 620px 440px at 8% 88%, rgba(16,185,129,0.09), transparent 70%);
  }

  .rings {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%);
    width: 900px;
    height: 900px;
    opacity: 0.35;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 260px 90px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand svg { width: 110px; height: 110px; }
  .brand .word {
    margin-top: 26px;
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .brand .word span { color: var(--gold); font-weight: 500; }

  .spacer { flex: 1; }

  .eyebrow {
    color: var(--emerald);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 40px;
  }
  .eyebrow::before {
    content: '—';
    color: var(--gold);
    margin-right: 0.6ch;
  }

  h1 {
    font-size: 104px;
    font-weight: 700;
    line-height: 1.08;
        color: var(--text);
    margin-bottom: 48px;
  }
  h1 .accent { color: var(--gold); }

  .sub {
    font-size: 36px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 780px;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--gold);
    color: #0a0a0b;
    font-size: 30px;
    font-weight: 700;
    padding: 26px 46px;
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="story">

    <svg class="rings" viewBox="0 0 200 200" fill="none" stroke-linecap="round">

      <circle cx="100" cy="100" r="88" stroke="#2a2a2e" stroke-width="1.5" />
      <circle cx="100" cy="100" r="58" stroke="#2a2a2e" stroke-width="1.5" />
      <g stroke="#d4af37">
        <path d="M187.7 92.3A88 88 0 0 1 100 188" stroke-width="3" opacity="0.3" />
        <path d="M158.9 165.4A88 88 0 0 1 100 188" stroke-width="3.4" opacity="0.9" />
        <circle cx="183.7" cy="72.8" r="2.6" opacity="0.32" fill="#d4af37" stroke="none" />
        <circle cx="173" cy="50.8" r="1.9" opacity="0.18" fill="#d4af37" stroke="none" />
        <circle cx="150.5" cy="27.9" r="1.3" opacity="0.09" fill="#d4af37" stroke="none" />
      </g>
      <circle cx="100" cy="188" r="5" fill="#d4af37" />
      <circle cx="100" cy="188" r="2.1" fill="#ffffff" opacity="0.85" stroke="none" />
      <g stroke="#10b981">
        <path d="M42.2 94.9A58 58 0 0 0 100 158" stroke-width="3" opacity="0.3" />
        <path d="M61.2 143.1A58 58 0 0 0 100 158" stroke-width="3.4" opacity="0.9" />
        <circle cx="44.8" cy="82.1" r="2.4" opacity="0.32" fill="#10b981" stroke="none" />
        <circle cx="51.9" cy="67.6" r="1.8" opacity="0.18" fill="#10b981" stroke="none" />
        <circle cx="66.7" cy="52.5" r="1.2" opacity="0.09" fill="#10b981" stroke="none" />
      </g>
      <circle cx="100" cy="158" r="5" fill="#10b981" />
      <circle cx="100" cy="158" r="2.1" fill="#ffffff" opacity="0.85" stroke="none" />
      <g transform="rotate(-18 100 100)" opacity="0.55">
        <path d="M14 100a86 34 0 1 0 172 0a86 34 0 1 0 -172 0" stroke="#2a2a2e" stroke-width="1" />
        <circle cx="180" cy="112" r="4.5" fill="#10b981" stroke="none" />
        <circle cx="172" cy="119" r="3.5" fill="#10b981" stroke="none" opacity="0.55" />
        <circle cx="162" cy="124" r="2.7" fill="#10b981" stroke="none" opacity="0.38" />
        <circle cx="150" cy="128" r="1.9" fill="#10b981" stroke="none" opacity="0.24" />
        <circle cx="135" cy="131" r="1.2" fill="#10b981" stroke="none" opacity="0.14" />
      </g>
    </svg>

    <div class="content">

      <div class="brand">
        <svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <radialGradient id="namp-mark-glow">
              <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
              <stop offset="60%" stop-color="#10b981" stop-opacity="0.05" />
              <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="66" fill="url(#namp-mark-glow)" stroke="none" />
          <circle cx="100" cy="100" r="88" stroke="#2a2a2e" stroke-width="3" />
          <circle cx="100" cy="100" r="58" stroke="#2a2a2e" stroke-width="3" />
          <g stroke="#d4af37">
            <path d="M187.7 92.3A88 88 0 0 1 100 188" stroke-width="7" opacity="0.3" />
            <path d="M158.9 165.4A88 88 0 0 1 100 188" stroke-width="8" opacity="0.9" />
            <circle cx="183.7" cy="72.8" r="5" opacity="0.32" fill="#d4af37" stroke="none" />
            <circle cx="173" cy="50.8" r="3.6" opacity="0.18" fill="#d4af37" stroke="none" />
            <circle cx="150.5" cy="27.9" r="2.4" opacity="0.09" fill="#d4af37" stroke="none" />
          </g>
          <circle cx="100" cy="188" r="10" fill="#d4af37" />
          <circle cx="100" cy="188" r="4.2" fill="#ffffff" opacity="0.85" stroke="none" />
          <g stroke="#10b981">
            <path d="M42.2 94.9A58 58 0 0 0 100 158" stroke-width="7" opacity="0.3" />
            <path d="M61.2 143.1A58 58 0 0 0 100 158" stroke-width="8" opacity="0.9" />
            <circle cx="44.8" cy="82.1" r="4.6" opacity="0.32" fill="#10b981" stroke="none" />
            <circle cx="51.9" cy="67.6" r="3.4" opacity="0.18" fill="#10b981" stroke="none" />
            <circle cx="66.7" cy="52.5" r="2.2" opacity="0.09" fill="#10b981" stroke="none" />
          </g>
          <circle cx="100" cy="158" r="10" fill="#10b981" />
          <circle cx="100" cy="158" r="4.2" fill="#ffffff" opacity="0.85" stroke="none" />
          <g transform="rotate(-18 100 100)" opacity="0.55">
            <path d="M14 100a86 34 0 1 0 172 0a86 34 0 1 0 -172 0" stroke="#2a2a2e" stroke-width="1" />
            <circle cx="180" cy="112" r="4.5" fill="#10b981" stroke="none" />
            <circle cx="172" cy="119" r="3.5" fill="#10b981" stroke="none" opacity="0.55" />
            <circle cx="162" cy="124" r="2.7" fill="#10b981" stroke="none" opacity="0.38" />
            <circle cx="150" cy="128" r="1.9" fill="#10b981" stroke="none" opacity="0.24" />
            <circle cx="135" cy="131" r="1.2" fill="#10b981" stroke="none" opacity="0.14" />
          </g>
          <path d="M68 136V64l64 72V64" stroke="#f4f4f5" stroke-width="20" />
        </svg>
        <div class="word">NAMP<span> Ingeniería</span></div>
      </div>

      <div class="spacer"></div>

      <!-- EDITAR -->
      <p class="eyebrow">Categoría</p>

      <!-- EDITAR -->
      <h1>Titular de la <span class="accent">historia</span></h1>

      <!-- EDITAR -->
      <p class="sub">Bajada corta, máximo dos líneas.</p>

      <div class="spacer"></div>

      <!-- EDITAR -->
      <div class="cta">@namp.cl</div>

    </div>
  </div>
</body>
</html>
